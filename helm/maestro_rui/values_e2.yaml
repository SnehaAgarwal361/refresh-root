# values for the PaaS Helm chart for Hydra
# https://enterprise-confluence.aexp.com/confluence/display/ED/Helm+Values+Reference

configMap:
  # values specific to your tenancy
  HOLOCRON_MODULE_MAP_URL: https://cdaas-test.aexp.com/cdaas/one-app/map/epaas-maestro-rui-e2/module-map.json
  ONE_CLIENT_ROOT_MODULE_NAME: know-your-customer-refresh-root
  ONE_CLIENT_CSP_REPORTING_URL: https://maestrorui-qa.aexp.com/_/report/security/csp-violation
  ONE_CLIENT_REPORTING_URL: https://maestrorui-qa.aexp.com/_/report/errors
  # values you probably don't need to change
  NODE_OPTIONS: --max-http-header-size=32768
  ONE_CLIENT_CDN_URL: https://cdaas-test.aexp.com/cdaas/one/
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: https://elfingest-qa.aexp.com/ot/v1/logs
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: https://elfingest-qa.aexp.com/ot/v1/logs
  OTEL_SERVICE_NAME: rui
  OTEL_SERVICE_NAMESPACE: maestro
  OTEL_RESOURCE_ATTRIBUTES: service.car.id=600001893,deployment.environment=E2
  # values you should not change
  NODE_EXTRA_CA_CERTS: /opt/amex/AmexOnDemandRootCAs.pem
  NODE_ENV: production
  ONE_CONFIG_ENV: e2
  ONE_CLIENT_LOCALE_FILENAME: qa
  HTTP_PORT: 8080
  HTTP_METRICS_PORT: 3005


deployment:
  # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-startup-probes
  containerPort: 8080
  readinessProbe:
    httpGet:
      path: /_/status
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 15
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /_/status
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 15
    failureThreshold: 3
  resourcesLimitsCPU: 1
  resourcesLimitsMemory: 4G
  resourcesRequestsCPU: 250m
  resourcesRequestsMemory: 1.5G

monitoring:
  type: prometheus
  path: /metrics
  port: 3005
  enabled: true
  filter:
    mode: include
    names:
      - istio_*
      - jvm_buffer*
      - process_*
      - jvm_threads_live_threads
      - oneapp_*
      - node_*
      - nodejs_*
      - http_*

# Horizontal Pod Autoscaling
hpa:
  cpuUtilizationPercentage: 75
  enabled: true
  maxReplicas: 1
  minReplicas: 1
